name: CI

# Run the workflow when commits are pushed on main or when a PR is modified
on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  #all static check like lint and assemble
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v3

      - run: chmod +x ./gradlew

      - name: KTFmt Check
        run: ./gradlew ktfmtCheck
      - name: Decode secrets
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" | base64 --decode > ./app/google-services.json
          else
            echo ":⚠️:GOOGLE_SERVICES secret is not set. google-services.json will not be created."
          fi
      - name: Lint and assemble
        run: ./gradlew assemble lint --parallel --build-cache
      # upload lint result to be use on the sonar job
      - name: Upload lint report
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.xml
  #run unit test
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v3

      - run: chmod +x ./gradlew
      - name: Decode secrets
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" | base64 --decode > ./app/google-services.json
          else
            echo ":⚠️:GOOGLE_SERVICES secret is not set. google-services.json will not be created."
          fi
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Start Firebase emulators
        run: |
          if [ -e "firebase.json" ] && jq -e '.emulators' firebase.json >/dev/null; then
            firebase emulators:start --only auth,firestore,storage &
          else
            echo "Firebase emulators not configured, skipping..."
          fi
      - name: Run unit tests + coverage
        run: ./gradlew check --parallel --build-cache
      # upload unit test result to be use on the sonar job
      - name: Upload unit test result
        uses: actions/upload-artifact@v4
        with:
          name: unit-result
          path: app/build/test-results/testDebugUnitTest/
      # upload unit test coverage to be use on the sonar job
      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: app/build/outputs/unit_test_code_coverage/
  #run android test
  android-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v3

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34

      - name: create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: small_phone
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - run: chmod +x ./gradlew
      - name: Decode secrets
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" | base64 --decode > ./app/google-services.json
          else
            echo ":⚠️:GOOGLE_SERVICES secret is not set. google-services.json will not be created."
          fi
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Start Firebase emulators
        run: |
          if [ -e "firebase.json" ] && jq -e '.emulators' firebase.json >/dev/null; then
            firebase emulators:start --only auth,firestore,storage &
            sleep 15
            echo "Waiting for emulators to be ready..."
            timeout 60 bash -c 'until curl -s http://localhost:4000 > /dev/null 2>&1; do echo "Waiting..."; sleep 2; done'
            echo "Emulators are ready!"
          else
            echo "Firebase emulators not configured, skipping..."
          fi

      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: small_phone
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            export RUNNING_ON_CI=true
            ./gradlew connectedCheck --parallel --build-cache -PRUNNING_ON_CI=$RUNNING_ON_CI
      # upload androit test result to be use on the sonar job
      - name: Upload android test result
        uses: actions/upload-artifact@v4
        with:
          name: android-result
          path: app/build/reports/coverage/androidTest/debug/connected/
      # upload androit test coverage to be use on the sonar job
      - name: Upload android coverage
        uses: actions/upload-artifact@v4
        with:
          name: android-coverage
          path: app/build/outputs/code_coverage/debugAndroidTest/
  #upload every things to sonar
  sonar:
    runs-on: ubuntu-latest
    needs: [static-checks, unit-tests, android-tests]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v3

      - run: chmod +x ./gradlew

      - name: Decode secrets
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" | base64 --decode > ./app/google-services.json
          else
            echo ":⚠️:GOOGLE_SERVICES secret is not set. google-services.json will not be created."
          fi
      #not pretty but didn't want to try to get compiled class from assemble task
      - name: Build debug classes
        run: ./gradlew :app:assembleDebug --build-cache
      - name: Download android coverage
        uses: actions/download-artifact@v4
        with:
          name: android-coverage
          path: app/build/outputs/code_coverage/debugAndroidTest/
      - name: Download android test result
        uses: actions/download-artifact@v4
        with:
          name: android-result
          path: app/build/reports/coverage/androidTest/debug/connected/
      - name: Download unit test coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-coverage
          path: app/build/outputs/unit_test_code_coverage/

      - name: Download unit test result
        uses: actions/download-artifact@v4
        with:
          name: unit-result
          path: app/build/test-results/testDebugUnitTest/

      - name: Download lint report
        uses: actions/download-artifact@v4
        with:
          name: android-lint-report
          path: app/build/reports/

      - name: Generate Coverage Report
        run: |
          ./gradlew jacocoTestReport
      - name: Run Sonar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --parallel --build-cache

